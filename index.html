<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMIDEL - Sistema de Facturación</title>
    <!-- Conectando los estilos externos -->
    <link rel="stylesheet" href="style-index.css">
</head>
<body>

    <!-- Formulario de Inicio de Sesión -->
    <div class="container" id="login-container">
        <div class="brand-logo">DCTEL</div>
        <div class="brand-subtitle">Sistema de Facturación</div>
        
        <h2>Iniciar Sesión</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Ingresar</button>
            <div class="error-message" id="error-msg" style="display: none;">Correo o contraseña incorrectos.</div>
        </form>
    </div>

    <!-- Panel de Bienvenida (Tras login exitoso) -->
    <div id="dashboard" style="display: none;">
        <div class="brand-logo" style="margin-bottom: 5px;">DOMIDEL</div>
        <h1>¡Bienvenido al Panel!</h1>
        <p>Has iniciado sesión correctamente. Haz clic en continuar para ingresar al sistema de facturación.</p>
        <button class="logout-btn" id="continue-btn" style="background-color: #28a745; margin-top: 15px;">Continuar</button>
    </div>

    <script>
        // Inicializar un usuario por defecto en localStorage si no existe
        if (!localStorage.getItem('usuario_demo')) {
            const userDemo = {
                email: "jdommy06@gmail.com",
                password: "Carlita76",
                nombre: "Administrador"
            };
            localStorage.setItem('usuario_demo', JSON.stringify(userDemo));
        }

        // Elementos del DOM
        const loginContainer = document.getElementById('login-container');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-msg');
        const continueBtn = document.getElementById('continue-btn');

        // IMPORTANTE: Al entrar al index, borramos cualquier sesión vieja 
        // para que SIEMPRE pida iniciar sesión primero.
        localStorage.removeItem('sesion_activa');

        // Manejar el evento de envío del formulario de login
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const emailVal = emailInput.value.trim();
            const passwordVal = passwordInput.value.trim();

            const storedUser = JSON.parse(localStorage.getItem('usuario_demo'));

            // Validar credenciales
            if (storedUser && storedUser.email === emailVal && storedUser.password === passwordVal) {
                localStorage.setItem('sesion_activa', 'true');
                errorMsg.style.display = 'none';
                mostrarDashboard();
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Botón Continuar: Te lleva directo al lobby.html
        continueBtn.addEventListener('click', function() {
            window.location.href = 'lobby.html';
        });

        function mostrarDashboard() {
            loginContainer.style.display = 'none';
            dashboard.style.display = 'block';
        }
    </script>
</body>
</html>
